<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks fixture</title>
<style>
  body { margin: 0; font: 16px system-ui, sans-serif; background: #f6f7f9; color: #1c1e21; }
  header { padding: 18px 28px; background: #1f3a5f; color: #fff; font-weight: 600; }
  main { max-width: 640px; margin: 32px auto; padding: 0 20px; }
  button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 0; background: #2f6fed; color: #fff; cursor: pointer; }
  button:hover { background: #1f57c4; }
  form { display: none; margin: 16px 0; gap: 8px; }
  form.open { display: flex; }
  input { flex: 1; font: inherit; padding: 8px 10px; border: 1px solid #b9c0cc; border-radius: 6px; }
  ul { list-style: none; padding: 0; }
  li { background: #fff; margin: 8px 0; padding: 12px 14px; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .spacer { height: 900px; }
  #footer-card { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
</style>
</head>
<body>
<header>Tasks</header>
<main>
  <button id="new" aria-label="New task">New task</button>
  <button id="flash" style="background:#555">Flash</button>
  <form id="form">
    <input id="title" placeholder="Task title" aria-label="Task title">
    <button type="submit" id="add">Add</button>
  </form>
  <ul id="list"><li>Write the launch notes</li></ul>
  <div class="spacer"></div>
  <div id="footer-card">All caught up.</div>
</main>
<script>
  document.getElementById("flash").onclick = () => { document.documentElement.style.background = "#ff0000"; document.body.style.background = "#ff0000"; };
  const form = document.getElementById("form");
  document.getElementById("new").onclick = () => { form.classList.add("open"); document.getElementById("title").focus(); };
  form.onsubmit = (e) => {
    e.preventDefault();
    const v = document.getElementById("title").value.trim();
    if (!v) return;
    const li = document.createElement("li");
    li.textContent = v;
    document.getElementById("list").prepend(li);
    document.getElementById("title").value = "";
  };
</script>
</body>
</html>
