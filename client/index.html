<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daedalus" />
    <meta name="theme-color" content="#ffffff" />
    <title>Daedalus</title>
    <script>
      (function () {
        // Applies the theme class before first paint — ThemeProvider (src/lib/theme.tsx)
        // does this in a useEffect, too late to stop a dark-mode user seeing a white
        // flash (and a white boot splash). Keep in sync with its "theme" storage key.
        try {
          var stored = localStorage.getItem("theme") || "system";
          var resolved =
            stored === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : stored;
          document.documentElement.classList.toggle("dark", resolved === "dark");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = resolved === "dark" ? "#0a0a0a" : "#ffffff";
        } catch (e) {}
      })();
    </script>
    <style>
      /* Boot splash: the <D> mark draws itself stroke by stroke, then the
         wordmark's characters rise in one by one. `boot-hold` runs for the whole
         sequence and its animationend is what dismisses the splash (main.tsx) —
         so retiming here needs no change there. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        --boot-fg: #0f172a;
        --boot-mark: #007595;
        transition: opacity 260ms ease-out;
      }
      .dark #boot-splash { background: #0a0a0a; --boot-fg: #ffffff; --boot-mark: #38bdf8; }
      #boot-splash.is-leaving { opacity: 0; pointer-events: none; }
      #boot-splash .boot-seq {
        display: flex;
        align-items: center;
        gap: 14px;
        animation: boot-hold 1700ms linear forwards;
      }
      #boot-splash svg { width: 56px; height: 56px; color: var(--boot-mark); }
      /* pathLength="1" normalises every path, so one dash rule draws them all
         regardless of their real length. */
      #boot-splash svg path {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: boot-draw 520ms ease-out forwards;
      }
      #boot-splash svg path:nth-child(2) { animation-delay: 90ms; }
      #boot-splash svg path:nth-child(3) { animation-delay: 260ms; }
      #boot-splash svg path:nth-child(4) { animation-delay: 340ms; }
      #boot-splash .boot-name {
        display: flex;
        font: 600 26px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: -0.02em;
        color: var(--boot-fg);
      }
      #boot-splash .boot-name span {
        opacity: 0;
        animation: boot-char 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @keyframes boot-char {
        from { opacity: 0; transform: translateY(0.32em); }
        to { opacity: 1; transform: translateY(0); }
      }
      /* Pure gate: no visual effect, it only marks when the sequence is over. */
      @keyframes boot-hold { from { opacity: 1; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash svg path { stroke-dashoffset: 0; animation: none; }
        #boot-splash .boot-name span { opacity: 1; animation: none; }
        #boot-splash .boot-seq { animation-duration: 1ms; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Loading">
      <div class="boot-seq">
        <!-- Same geometry as /logo.svg, inlined so it paints and animates before
             the bundle loads. Keep the two in sync. -->
        <svg viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <path pathLength="1" d="M20 17 L9 32 L20 47" />
          <path pathLength="1" d="M44 17 L55 32 L44 47" />
          <path pathLength="1" d="M25 21 V43" />
          <path pathLength="1" d="M25 21 H28 A11 11 0 0 1 28 43 H25" />
        </svg>
        <span class="boot-name" aria-hidden="true"
          ><span style="animation-delay: 560ms">D</span
          ><span style="animation-delay: 615ms">a</span
          ><span style="animation-delay: 670ms">e</span
          ><span style="animation-delay: 725ms">d</span
          ><span style="animation-delay: 780ms">a</span
          ><span style="animation-delay: 835ms">l</span
          ><span style="animation-delay: 890ms">u</span
          ><span style="animation-delay: 945ms">s</span
        ></span>
      </div>
    </div>
    <script>
      // The intro can finish before the bundle parses, and an animationend fired
      // then would be missed by a listener attached in main.tsx. Latch it here,
      // pre-paint, and hand main.tsx a promise that has already settled.
      window.__bootIntro = new Promise(function (resolve) {
        document
          .getElementById("boot-splash")
          .addEventListener("animationend", function (e) {
            if (e.animationName === "boot-hold") resolve();
          });
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
