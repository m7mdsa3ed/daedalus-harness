<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `interactive-widget=overlays-content`: raising the soft keyboard must not
         resize or scroll the page — a transcript that jumps half a screen on
         focus has lost the reader's place. The keyboard is drawn over the
         bottom instead, and the one surface that has to move (the docked
         composer) is moved from `--keyboard-inset` — see lib/keyboard-inset.ts. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Daedalus" />
    <!-- One theme-color, no media query: the app's own mode is what the
         platform is told, whatever the OS prefers. Overwritten a few lines
         down from the cached palette colour, and again by ThemeProvider on
         every theme change once the stylesheet exists. This literal is only
         what a browser with the script blocked is left with — the Default
         palette's light background; keep it equal to src/lib/boot-colors.ts. -->
    <meta name="theme-color" content="#ffffff" />
    <title>Daedalus</title>
    <script>
      (function () {
        // Applies the theme class before first paint — ThemeProvider (src/lib/theme.tsx)
        // does this in a useEffect, too late to stop a dark-mode user seeing a white
        // flash (and a white boot splash). Keep in sync with its "theme" and
        // "ui.colorTheme" storage keys.
        try {
          var stored = localStorage.getItem("theme") || "system";
          var resolved =
            stored === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : stored;
          document.documentElement.classList.toggle("dark", resolved === "dark");
          document.documentElement.style.colorScheme = resolved;
          // The sidebar layout too (src/lib/layout-options.ts, "ui.viewOptions";
          // "ui.sidebarLayout" is where a device that has not run this build
          // yet still keeps it), so an inset layout does not paint flat for a frame.
          var layout = JSON.parse(localStorage.getItem("ui.viewOptions") || "{}");
          var legacy = JSON.parse(localStorage.getItem("ui.sidebarLayout") || "{}");
          document.documentElement.dataset.sidebarLayout =
            (layout.sidebarVariant || legacy.variant) === "inset" ? "inset" : "sidebar";
          document.documentElement.dataset.workspaceTabs =
            layout.hideWorkspaceTabs === true ? "hidden" : "shown";
          // The palette too: without it the first paint is Default and the app
          // visibly re-tints once ThemeProvider mounts. A custom palette's CSS
          // still arrives with the bundle, but the splash covers that gap.
          var palette = localStorage.getItem("ui.colorTheme");
          if (palette) document.documentElement.dataset.colorTheme = palette;
          // The status bar / address bar is tinted from this meta, and the
          // platform reads it before the stylesheet exists — so it gets the
          // Default palette's background for the mode (src/lib/boot-colors.ts)
          // and ThemeProvider replaces it with the rendered one once mounted.
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = resolved === "dark" ? "#0a0a0a" : "#ffffff";
        } catch (e) {}
      })();
    </script>
    <style>
      /* Kaushan Script from Fontsource (OFL), bundled locally for the app
         and loaded here early so the splash uses the same face before React. */
      @font-face {
        font-family: "Kaushan Script";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("/fonts/kaushan-script-latin-400-normal.woff2") format("woff2");
      }
      /* Boot splash: the labyrinth draws itself ring by ring, its centre pops,
         then a dark cover slides off the wordmark, like IPTV's handwriting
         reveal. `boot-hold` runs for the whole sequence and its animationend is
         what dismisses the splash (main.tsx), so retiming it needs no change there. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        /* The app's own background (src/lib/boot-colors.ts), so the
           splash and the first paint behind it are one colour rather than two
           near-blacks a frame apart. */
        background: #ffffff;
        --boot-fg: #0f172a;
        --boot-mark: #0f172a;
        transition: opacity 260ms ease-out;
      }
      .dark #boot-splash { background: #0a0a0a; --boot-fg: #ffffff; --boot-mark: #f8fafc; }
      #boot-splash.is-leaving { opacity: 0; pointer-events: none; }
      /* The splash starts paused and the gate script below releases it. Chrome
         prerenders the root URL from the omnibox: without the gate the whole
         sequence plays — and dismisses itself — before the tab is ever shown,
         so "/" appeared to have no splash at all. The gate also waits briefly
         for the bundled wordmark face before revealing it. */
      #boot-splash.boot-wait .boot-seq,
      #boot-splash.boot-wait svg path,
      #boot-splash.boot-wait .boot-word,
      #boot-splash.boot-wait .boot-cover { animation-play-state: paused; }
      #boot-splash .boot-seq {
        display: flex;
        align-items: center;
        gap: 12px;
        /* boot-rise is the entrance; boot-hold stays last so its animationend
           is still what dismisses the splash. */
        animation:
          boot-rise 560ms cubic-bezier(0.22, 1, 0.36, 1) both,
          boot-hold 1700ms linear forwards;
      }
      #boot-splash svg { width: 44px; height: 44px; color: var(--boot-mark); }
      /* pathLength="1" normalises every path, so one dash rule draws them all
         regardless of their real length. */
      #boot-splash svg path {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: boot-draw 560ms cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      #boot-splash svg path:nth-child(2) { animation-delay: 200ms; }
      /* The centre lands last and does not draw — it pops, with a little spring. */
      #boot-splash svg path:nth-child(3) {
        animation: boot-core 320ms 520ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        stroke-dashoffset: 0;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        transform: scale(0);
      }
      #boot-splash .boot-name {
        position: relative;
        display: inline-block;
        padding: 0 0.16em 0.08em 0.02em;
        overflow: hidden;
        font: 400 31px/1.35 "Kaushan Script", cursive;
        letter-spacing: 0;
        color: var(--boot-fg);
      }
      /* The word is fully set; the cover glides off to uncover it without
         clipping or repainting the lettering. */
      #boot-splash .boot-word {
        display: inline-block;
        opacity: 0;
        animation: boot-word-in 1ms 520ms forwards;
      }
      #boot-splash .boot-cover {
        position: absolute;
        inset: 0 -0.08em 0 0;
        background: #ffffff;
        transform: translateX(0);
        animation: boot-uncover 900ms 520ms cubic-bezier(0.5, 0, 0.2, 1) forwards;
      }
      .dark #boot-splash .boot-cover { background: #0a0a0a; }
      @keyframes boot-rise {
        from { opacity: 0; transform: translateY(6px) scale(0.98); }
        to { opacity: 1; transform: none; }
      }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @keyframes boot-core { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
      @keyframes boot-word-in { to { opacity: 1; } }
      @keyframes boot-uncover { to { transform: translateX(105%); } }
      /* Pure gate: no visual effect, it only marks when the sequence is over. */
      @keyframes boot-hold { from { opacity: 1; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        /* No movement — mark and wordmark appear fully formed — but the splash
           still holds briefly: boot-hold's end is what dismisses it (main.tsx),
           so near-zero here made the splash invisible, not calm. */
        #boot-splash svg path { stroke-dashoffset: 0; opacity: 1; transform: none; animation: none; }
        #boot-splash .boot-word { opacity: 1; animation: none; }
        #boot-splash .boot-cover { display: none; animation: none; }
        #boot-splash .boot-seq { animation: boot-hold 700ms linear forwards; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" class="boot-wait" role="status" aria-label="Loading">
      <div class="boot-seq">
        <!-- Same geometry as /logo.svg, inlined so it paints and animates before
             the bundle loads. Keep the two in sync. -->
        <svg viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <path pathLength="1" d="M38 8H46A10 10 0 0 1 56 18V46A10 10 0 0 1 46 56H18A10 10 0 0 1 8 46V18A10 10 0 0 1 18 8H26" />
          <path pathLength="1" d="M28 45H25A6 6 0 0 1 19 39V25A6 6 0 0 1 25 19H39A6 6 0 0 1 45 25V39A6 6 0 0 1 39 45H36" />
          <path pathLength="1" d="M32 31V33" />
        </svg>
        <span class="boot-name" aria-hidden="true">
          <span class="boot-word">Daedalus</span>
          <span class="boot-cover"></span>
        </span>
      </div>
    </div>
    <script>
      (function () {
        var splash = document.getElementById("boot-splash");
        if (!splash) return;
        // The intro can finish before the bundle parses, and an animationend
        // fired then would be missed by a listener attached in main.tsx. Latch
        // it here, pre-paint, and hand main.tsx a promise already settled.
        window.__bootIntro = new Promise(function (resolve) {
          splash.addEventListener("animationend", function (e) {
            if (e.animationName === "boot-hold") resolve();
          });
        });
        // Release the paused sequence (see .boot-wait above) only once the page
        // is genuinely on screen — a prerendered or background-tab document
        // would play the intro to nobody — and the script face is in, capped so
        // a failed font costs 300ms, not the boot.
        var started = false;
        var start = function () {
          if (started || document.prerendering || document.visibilityState === "hidden") return;
          started = true;
          document.removeEventListener("prerenderingchange", start);
          document.removeEventListener("visibilitychange", start);
          var go = function () {
            splash.classList.remove("boot-wait");
          };
          if (document.fonts && document.fonts.load) {
            var cap = setTimeout(go, 300);
            document.fonts.load('400 31px "Kaushan Script"').then(
              function () { clearTimeout(cap); go(); },
              function () { clearTimeout(cap); go(); }
            );
          } else {
            go();
          }
        };
        document.addEventListener("prerenderingchange", start);
        document.addEventListener("visibilitychange", start);
        start();
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
