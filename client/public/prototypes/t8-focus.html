<!doctype html>
<!--
  T8 — Focus. The conversation, the work behind it.

  The current layout gives every step a full-width row and docks the composer
  over the foot of the transcript. This one does the opposite: the column is
  narrower and the composer sits *in the flow*, at the point the next message
  will land. The turn's work is collapsed to one summary line by default and
  the prose is set larger with more leading — so a thread is a correspondence
  you read top to bottom, with the transcript's own record folded behind each
  exchange when you want it.

  The composer in flow is the load-bearing change: it means the glass never
  covers what you were reading, and the thing you type into is where the
  conversation is going rather than a bar pinned over it.
-->
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<title>T8 — Focus</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./transcript.css" />
<style>
  :root { --harness-chat-width: 680px; --harness-composer-width: 648px; }
  /* Nothing is docked over the transcript here, so it reserves nothing. */
  .tv-scroll { padding-bottom: 40px; --dock-h: 0px; }
  .prose { font-size: 0.9375rem; line-height: 1.8; }
  .u-bubble { font-size: 0.9375rem; padding: 11px 16px; }
  /* The work, folded to one line per run, aligned with the prose. */
  .fold { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
  .fold .line { flex: 1; height: 1px; background: var(--border-60); }
  .fold button { display: inline-flex; align-items: center; gap: 7px; font-size: 0.6875rem; color: color-mix(in oklab, var(--muted-foreground) 78%, transparent); white-space: nowrap; }
  .fold button:hover { color: var(--foreground); }
  .fold .steps { margin-top: 8px; }
  /* The composer, in the flow, where the next turn starts. The dock is static
     here — a pane's own element, not an overlay on the transcript's foot. */
  .inline-dock { padding: 18px 0 0; }
  .inline-dock .dock { position: static; padding: 0; }
  .inline-dock .composer { max-width: 100%; }
  .inline-dock .composer-card { box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .endnote { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 26px 0 0; font-size: 0.6875rem; color: color-mix(in oklab, var(--muted-foreground) 65%, transparent); }
  .endnote svg { width: 12px; height: 12px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" data-sidebar></aside>
  <main class="main">
    <div data-tabs></div>
    <div class="panel">
      <div class="tv">
        <div class="tv-scroll"><div class="col" data-flow></div></div>
      </div>
    </div>
  </main>
</div>
<script src="./shared-transcript.js"></script>
<script>
  const rows = TX.flow()
  const { esc, I } = TX
  const fold = (r) => `
    <div class="fold">
      <span class="line"></span>
      <button onclick="const d=this.parentElement.nextElementSibling;d.hidden=!d.hidden">${I.chev} ${esc(r.summary)}</button>
      <span class="line"></span>
    </div>`

  document.querySelector("[data-tabs]").innerHTML = TX.tabs("Ship the composer width fix")
  const html = rows
    .map((r) => {
      if (r.t === "run") return fold(r) + `<div hidden>${TX.render([r])}</div>`
      return TX.render([r])
    })
    .join("")
  /* The composer rides the flow at the foot, so the transcript ends where the
     next message will land. */
  document.querySelector("[data-flow]").innerHTML =
    html +
    `<div class="inline-dock">${TX.composer({ placeholder: "Message Daedalus…", ready: true })}</div>` +
    `<div class="endnote">end of thread</div>`

  TX.sidebar(document.querySelector("[data-sidebar]"))
  TX.theme()
</script>
</body>
</html>
