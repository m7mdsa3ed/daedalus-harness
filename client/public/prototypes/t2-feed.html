<!doctype html>
<!--
  T2 — Prose feed. Hide the work, keep the conversation.

  The layout for reading, not auditing: every tool call, thought and run folds
  into a single margin mark on the left of the prose it belongs to. The column
  is 12px narrower, prose gets the extra leading, and the work is a hairline
  you can expand — never a row that competes with the sentence beside it.

  What it costs: you cannot see what the agent touched without opening it.
  What it buys: a long thread reads as a document, and `Search`/`Read`/`Edit`
  stop repeating forty times down the page.
-->
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<title>T2 — Prose feed</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./transcript.css" />
<style>
  :root { --dock-h: 220px; --harness-chat-width: 720px; }
  .feed { position: relative; padding-left: 34px; }
  .feed::before { content: ""; position: absolute; left: 11px; top: 8px; bottom: 8px; width: 1px; background: var(--border-60); }
  .feed .u-msg, .feed .a-msg, .feed .card, .feed .notice { position: relative; }
  .prose { font-size: 0.9375rem; line-height: 1.75; }
  /* The work, as a mark on the rail. Click opens the whole run's steps. */
  .workfold { position: relative; margin: 2px 0; }
  .workfold > button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font-size: 0.6875rem; color: color-mix(in oklab, var(--muted-foreground) 80%, transparent); }
  .workfold > button:hover { color: var(--foreground); }
  .workfold .node { position: absolute; left: -34px; top: 2px; margin-left: 7px; width: 9px; height: 9px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--step-tool) 70%, transparent); }
  .workfold .node.busy { box-shadow: inset 0 0 0 1.5px var(--step-tool); animation: pulse 1.6s ease-in-out infinite; }
  .workfold .node.ok { background: color-mix(in oklab, var(--step-tool) 60%, var(--card)); box-shadow: none; }
  .workfold .lab { font-variant-numeric: tabular-nums; }
  .workfold .detail { margin: 6px 0 10px; padding-left: 2px; }
  /* The plan gets a quiet rule, not a card. */
  .planline { position: relative; margin: 10px 0; }
  .planline > button { display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left; font-size: 0.75rem; color: var(--muted-foreground); }
  .planline .node { position: absolute; left: -34px; margin-left: 7px; top: 4px; width: 9px; height: 9px; border-radius: 2px; box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--muted-foreground) 70%, transparent); }
  .planline .todos { margin-top: 8px; }
  .todos .todo { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--muted-foreground); padding: 2px 0; }
  .todos .box { width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--muted-foreground) 50%, transparent); display: grid; place-items: center; flex: 0 0 auto; }
  .todos .box svg { width: 9px; height: 9px; }
  .todos .todo[data-done="true"] .box { background: var(--primary); color: var(--primary-foreground); box-shadow: none; }
  .todos .todo[data-done="true"] .txt { text-decoration: line-through; opacity: 0.6; }
  .todos .todo[data-active="true"] .txt { color: var(--foreground); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" data-sidebar></aside>
  <main class="main">
    <div data-tabs></div>
    <div class="panel">
      <div class="tv">
        <div class="tv-scroll"><div class="col"><div class="feed" data-flow></div></div></div>
        <div data-dock></div>
      </div>
    </div>
  </main>
</div>
<script src="./shared-transcript.js"></script>
<script>
  const rows = TX.flow()
  const { esc } = TX

  /* The plan as one line on the rail. */
  const planLine = (r) => `
    <div class="planline" data-open>
      <span class="node"></span>
      <button onclick="this.parentElement.toggleAttribute('data-open');this.nextElementSibling.hidden=!this.nextElementSibling.hidden">
        Plan · ${r.todos.filter((t) => t.done).length}/${r.todos.length} steps
      </button>
      <div class="todos">
        ${r.todos
          .map(
            (td) =>
              `<div class="todo" data-done="${!!td.done}" data-active="${!!td.active}"><span class="box">${td.done ? TX.I.check : ""}</span><span class="txt">${esc(td.text)}</span></div>`
          )
          .join("")}
      </div>
    </div>`

  /* The work, as one mark. Running = a pulsing node; done = a quiet count. */
  const workFold = (r) => `
    <div class="workfold">
      <span class="node ${r.active ? "busy" : "ok"}"></span>
      <button onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">
        <span class="lab">${esc(r.summary)}</span>
      </button>
      <div class="detail" hidden><div class="rail" style="border:0;margin:0;padding:0">${r.items.map((it) => TX.step(it)).join("")}</div></div>
    </div>`

  document.querySelector("[data-tabs]").innerHTML = TX.tabs("Ship the composer width fix")
  document.querySelector("[data-flow]").innerHTML = rows
    .map((r) => {
      if (r.t === "run") return workFold(r)
      if (r.t === "plan") return planLine(r)
      if (r.t === "thought")
        return `<div class="workfold"><span class="node ok"></span><button>thought — ${esc(r.preview.slice(0, 64))}…</button><div class="detail" hidden><div class="pane-pad" style="font-size:12px;color:var(--muted-foreground)">${esc(r.text)}</div></div></div>`
      return TX.render([r])
    })
    .join("")
  document.querySelector("[data-dock]").innerHTML = TX.composer({ placeholder: "Reply…" })
  TX.sidebar(document.querySelector("[data-sidebar]"))
  TX.theme()
</script>
</body>
</html>
