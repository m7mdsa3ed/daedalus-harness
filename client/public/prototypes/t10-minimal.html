<!doctype html>
<!--
  T10 — Minimal. Strip it to the conversation.

  Everything that is not the conversation is gone: no tab strip, no sidebar, no
  composer card, no footer, no timestamps, no rail. Your prompt is one line
  under a rule; the agent's answer is prose; a step is a bare icon with its
  title on hover. The composer is at the foot, full width, one hairline tall.

  This is the option for a thread on a phone, or for someone who reads the
  transcript and nothing else. What it costs: every reading the app has — what
  a turn cost, what it touched, which tools the thread carries, how full the
  window is — is somewhere else or nowhere.
-->
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<title>T10 — Minimal</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./transcript.css" />
<style>
  :root { --dock-h: 74px; --harness-chat-width: 720px; }
  body { background: var(--background); }
  .app { display: block; }
  .sidebar, .tabs { display: none; }
  .main { padding: 0; height: 100vh; }
  .panel { border-radius: 0; background: transparent; }
  .tv-scroll { padding-top: 40px; }
  .prose { font-size: 0.9375rem; line-height: 1.75; }
  /* Your prompt: one rule, then the words. */
  .u-msg { align-items: flex-start; padding: 22px 0 12px; border-top: 1px solid var(--border-60); }
  .u-msg:first-child { border-top: 0; padding-top: 0; }
  .u-bubble { max-width: 100%; background: none !important; padding: 0; font-size: 0.9375rem; font-weight: 500; border-radius: 0; }
  .u-meta { display: none; }
  /* A step: a bare mark, the name on hover. */
  .step .mark { width: 18px; }
  .step .title { color: transparent; transition: color 140ms; font-size: 0.75rem; }
  .step:hover .title, .step[data-open] .title { color: var(--muted-foreground); }
  .step .meta { display: none; }
  .step .step-rowz { margin: 0; width: 100%; padding: 1px 0; }
  .step.expandable:hover .step-rowz, .step[data-open] .step-rowz { background: none; }
  .step .cap { display: none; }
  .file-chip { display: none; }
  /* A run: a bare count, no avatar stack, no rule. */
  .run-head { margin: 0; width: 100%; padding: 1px 0; }
  .run-head:hover { background: none; }
  .run-head .stack { display: none; }
  .run-head .sum { font-size: 0.6875rem; color: color-mix(in oklab, var(--muted-foreground) 60%, transparent); }
  .rail { border-left: 1px solid var(--border-60); margin-left: 8px; padding-left: 10px; }
  /* Cards keep a hairline and no wash. */
  .card { background: none; border: 0; border-top: 1px solid var(--border-60); border-radius: 0; padding: 10px 0; margin: 8px 0; }
  .card.warn, .card.bad { background: none; }
  .notice { border: 0; }
  .notice::before, .notice::after { background: var(--border); }
  /* The composer: one line, no card. */
  .dock { padding: 0 16px 18px; }
  .composer { max-width: var(--harness-composer-width); }
  .composer-card { background: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; border-radius: 0; border-top: 1px solid var(--border); padding-top: 6px; }
  .shelf-top, .shelf-bottom, .pill { display: none; }
  .tbox { padding: 8px 0 0; }
  .tbox .send { width: 26px; height: 26px; background: none; color: var(--muted-foreground); }
  .tbox .send.on { background: var(--primary); color: var(--primary-foreground); }
  .todos .todo { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--muted-foreground); padding: 2px 0; }
  .todos .box { width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--muted-foreground) 50%, transparent); display: grid; place-items: center; }
  .todos .box svg { width: 9px; height: 9px; }
  .todos .todo[data-done="true"] .box { background: var(--primary); color: var(--primary-foreground); box-shadow: none; }
  .todos .todo[data-done="true"] .txt { text-decoration: line-through; opacity: 0.55; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" data-sidebar></aside>
  <main class="main">
    <div class="panel">
      <div class="tv">
        <div class="tv-scroll"><div class="col" data-flow></div></div>
        <div data-dock></div>
      </div>
    </div>
  </main>
</div>
<script src="./shared-transcript.js"></script>
<script>
  document.querySelector("[data-flow]").innerHTML = TX.render(TX.flow(), { runs: () => false })
  document.querySelector("[data-dock]").innerHTML = TX.composer({ placeholder: "Message…", ready: true })
</script>
</body>
</html>
