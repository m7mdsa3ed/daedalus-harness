<!doctype html>
<!--
  C1 — Current composer. The baseline.

  The unit as it ships: a shelf that is a pile of cards (the front one open,
  the rest a 14px sliver), the frosted card with the textarea over its toolbar
  row, and the footer that is always drawn — the project, the tools, and the
  readings clustered at the end (config, plan, agents, changes, the context
  ring).

  The two rules the variants argue with are both here: the shelf's pile is
  transient and the footer is permanent, and the card is one width that never
  moves on focus. Annotations name the parts; the notes below say what each is
  for.
-->
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<title>C1 — Current composer</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./transcript.css" />
<link rel="stylesheet" href="./composer.css" />
<style>
  :root { --dock-h: 220px; }
  .tv { position: absolute; inset: 0; }
  .tv-scroll { filter: blur(0); }
  /* The transcript behind is dimmed, because the subject is the composer. */
  .tv .col { opacity: 0.4; mask-image: linear-gradient(to bottom, #000, #000 45%, transparent 96%); -webkit-mask-image: linear-gradient(to bottom, #000, #000 45%, transparent 96%); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" data-sidebar></aside>
  <main class="main">
    <div data-tabs></div>
    <div class="panel">
      <div class="tv">
        <div class="tv-scroll"><div class="col" data-flow></div></div>
        <div data-dock></div>
      </div>
      <div class="note right" style="left:14px; top:34%"><b>Shelf</b> — the pile: the front card open, the rest a 14px sliver. Transient.</div>
      <div class="note left" style="right:14px; top:14%"><b>Readings</b> — one shape, one place: config, plan, agents, changes, the context ring.</div>
    </div>
  </main>
</div>
<script src="./shared-transcript.js"></script>
<script src="./shared-composer.js"></script>
<script>
  document.querySelector("[data-tabs]").innerHTML = TX.tabs("Ship the composer width fix")
  document.querySelector("[data-flow]").innerHTML = TX.render(TX.flow())
  /* The shelf's front card is the checklist; the queue and the files are behind. */
  document.querySelector("[data-dock]").innerHTML = CX.composer({ shelf: "queue", text: "Reply…", footFiles: 3 })
  TX.sidebar(document.querySelector("[data-sidebar]"))
  TX.theme()
</script>
</body>
</html>
