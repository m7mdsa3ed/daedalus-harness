<!doctype html>
<!--
  v13 — Two-line rows. v2's structure exactly: the same tiers, the same project
  folders, the same chips and footer. The change is the *row*.

  v2's row is one line: title, and whatever status/time survives the truncation.
  That is fine while titles are short and breaks down the moment they are not —
  "for the excel clean up it use the main chat completion like" is a title in
  this very workspace, and at 272px it is most of the row. Here every thread is
  two lines:

      Ship the composer width fix              ●
      harness · 2m ago

  The title gets a line of its own to truncate against, and the project — which
  v2 only shows on hover, inside the ⋯ card — is on the row, on every row, where
  a list that holds four projects needs it to be. The cost is 16px a row.
-->
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<title>v13 — Two-line rows</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --radius: 0.625rem; --radius-xl: calc(var(--radius) * 1.4);
    --background: oklch(1 0 0); --foreground: oklch(0.145 0 0); --card: oklch(1 0 0);
    --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.556 0 0); --primary: oklch(0.205 0 0);
    --sidebar: var(--background); --sidebar-foreground: oklch(0.145 0 0);
    --sidebar-accent: oklch(0.9 0 0); --sidebar-border: oklch(0.91 0 0);
    --app-ground: oklch(0.97 0 0); --amber: oklch(0.769 0.188 70.08);
    --green: oklch(0.723 0.219 149.579); --destructive: oklch(0.577 0.245 27.325);
    --blue: oklch(0.707 0.165 254.624); --violet: oklch(0.606 0.25 292.717);
  }
  html.dark {
    --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0); --card: oklch(0.205 0 0);
    --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0); --primary: oklch(0.922 0 0);
    --sidebar: var(--background); --sidebar-foreground: oklch(0.985 0 0);
    --sidebar-accent: oklch(0.269 0 0); --sidebar-border: oklch(1 0 0 / 10%);
    --app-ground: oklch(0.12 0 0);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Figtree", ui-sans-serif, system-ui, sans-serif; font-size: 13px; line-height: 1.35;
    color: var(--foreground); background: var(--app-ground); -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { width: 16px; height: 16px; flex: 0 0 auto; }
  [hidden] { display: none !important; }

  .app { display: flex; height: 100vh; overflow: hidden; }
  .sidebar {
    --w: 272px; width: var(--w); min-width: 210px; max-width: 440px; flex: 0 0 auto;
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--sidebar); border-right: 1px solid var(--sidebar-border);
  }
  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; padding: 6px 6px 6px 0; }
  .tabs { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 4px; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 10px;
    border-radius: 8px; color: var(--muted-foreground); box-shadow: inset 0 0 0 1px var(--sidebar-border);
  }
  .tab[data-active="true"] { color: var(--foreground); background: var(--card); box-shadow: inset 2px 0 0 0 var(--primary), 0 1px 2px rgba(0,0,0,.12); }
  .card { flex: 1 1 auto; border-radius: var(--radius-xl); background: var(--card); display: grid; place-items: center; color: var(--muted-foreground); font-size: 12px; }

  .head { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; padding: 10px 8px 4px; }
  .brand-row { display: flex; align-items: center; gap: 8px; height: 28px; padding-left: 4px; }
  .logo { width: 20px; height: 20px; border-radius: 6px; background: linear-gradient(140deg, var(--violet), var(--blue)); display: grid; place-items: center; color: white; }
  .logo svg { width: 12px; height: 12px; }
  .brand-row span { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .head-actions { margin-left: auto; display: flex; gap: 2px; }
  .icon-btn { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; color: var(--muted-foreground); }
  .icon-btn:hover { background: var(--sidebar-accent); color: var(--sidebar-foreground); }
  .primary { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 8px; background: var(--sidebar-accent); font-weight: 500; }
  .primary:hover { filter: brightness(1.07); }
  .search { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 9px; border-radius: 8px; color: var(--muted-foreground); box-shadow: inset 0 0 0 1px var(--sidebar-border); }
  .search:hover { background: var(--sidebar-accent); }
  kbd { font: inherit; font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-left: auto; color: var(--muted-foreground); background: var(--muted); box-shadow: 0 0 0 1px var(--sidebar-border); }

  .chip-row { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 8px 2px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 25px; padding: 0 9px 0 7px;
    border-radius: 999px; font-size: 12px; background: var(--muted); box-shadow: inset 0 0 0 1px var(--sidebar-border); }
  .chip:hover { background: var(--sidebar-accent); }
  .chip .dot { width: 6px; height: 6px; }

  .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 2px 8px 10px; }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: color-mix(in oklab, var(--foreground) 18%, transparent); border-radius: 999px; }

  .tier { display: flex; align-items: center; gap: 6px; height: 22px; margin-top: 8px; padding: 0 8px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
    color: color-mix(in oklab, var(--sidebar-foreground) 52%, transparent); }
  .tier:first-child { margin-top: 2px; }
  .tier .n { margin-left: auto; letter-spacing: 0; font-weight: 600; opacity: 0.7; }

  /* ── The two-line row ──
     46px: an 18px title line over a 14px meta line, 7px of inset. The title is
     `block` so it truncates against the row's own width rather than a flex
     basis, and the status dot sits on the *first* line — it is about the title,
     not about the meta. */
  .row {
    display: grid; grid-template-columns: 1fr auto; grid-auto-flow: column;
    grid-template-areas: "title status" "meta meta";
    align-items: center; gap: 0 8px; width: 100%; padding: 6px 8px; border-radius: 8px; text-align: left;
  }
  .row:hover { background: var(--sidebar-accent); }
  .row[data-active="true"] { background: var(--sidebar-accent); }
  .row .title { grid-area: title; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13px; line-height: 18px; }
  .row[data-active="true"] .title { font-weight: 600; }
  .row .status { grid-area: status; display: flex; align-items: center; }
  .row .meta { grid-area: meta; display: flex; align-items: center; gap: 6px; min-width: 0;
    font-size: 11px; line-height: 14px; color: var(--muted-foreground); }
  .row .meta .p { color: color-mix(in oklab, var(--muted-foreground) 100%, transparent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta .sep { opacity: 0.5; }
  .row .meta .when { font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .row .dot { width: 7px; height: 7px; border-radius: 999px; }
  .dot.running { background: var(--green); animation: pulse 1.6s ease-in-out infinite; }
  .dot.waiting { background: var(--amber); }
  .dot.failed { background: var(--destructive); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  /* A thread waiting on you: the answer line replaces the meta line, in the
     tone of the ask. That is the reading the row is two lines wide for. */
  .row .meta.ask { color: color-mix(in oklab, var(--amber) 70%, var(--foreground)); }

  .folder { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 7px;
    width: 100%; height: 34px; padding: 0 8px; border-radius: 8px; text-align: left; }
  .folder:hover { background: var(--sidebar-accent); }
  .folder .mark { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; color: white; font-size: 10px; font-weight: 700; }
  .folder .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folder .sub { font-size: 11px; color: var(--muted-foreground); }
  .folder .n { font-size: 11px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .tree { margin-left: 14px; padding-left: 8px; border-left: 1px solid var(--sidebar-border); }
  .chev { color: var(--muted-foreground); transition: transform 180ms ease; }
  [aria-expanded="true"] > .chev { transform: rotate(90deg); }

  .foot { flex: 0 0 auto; display: flex; flex-direction: column; gap: 1px; padding: 6px 8px 8px; border-top: 1px solid var(--sidebar-border); }
  .foot .frow { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 8px; }
  .foot .frow:hover { background: var(--sidebar-accent); }
  .foot .frow .sub { font-size: 11px; color: var(--muted-foreground); }
  .foot-nav { display: flex; flex-wrap: wrap; gap: 2px; padding: 0 2px; }
  .nav-link { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 7px; border-radius: 6px; font-size: 12px; color: var(--muted-foreground); }
  .nav-link:hover { background: var(--sidebar-accent); color: var(--sidebar-foreground); }
  .nav-link .n { font-size: 11px; opacity: 0.8; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header class="head">
      <div class="brand-row">
        <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M12 12v10"/></svg></span>
        <span>Daedalus</span>
        <div class="head-actions"><button class="icon-btn" title="Sort and filter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5h18M6 12h12M10 19h4"/></svg></button></div>
      </div>
      <button class="primary" id="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New thread<kbd>⌘N</kbd></button>
      <button class="search" id="search"></button>
    </header>
    <div class="chip-row" id="chips"></div>
    <div class="scroll" id="scroll"></div>
    <footer class="foot" id="foot"></footer>
  </aside>

  <main class="main">
    <div class="tabs">
      <button class="tab" data-active="true"><span class="dot" style="width:6px;height:6px;border-radius:999px;background:var(--green)"></span>Ship the composer width fix</button>
      <button class="tab">Index the rules table</button>
      <button class="tab" style="width:30px;padding:0;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="card">the dock — the transcript in front of you</div>
  </main>
</div>

<script>
  const PROJECTS = [
    { id: "harness", name: "daedalus-harness", short: "harness", hue: 292, initial: "D" },
    { id: "website", name: "marketing-site", short: "marketing-site", hue: 210, initial: "M" },
    { id: "infra", name: "infra", short: "infra", hue: 150, initial: "I" },
    { id: "docs", name: "handbook", short: "handbook", hue: 60, initial: "H" },
  ]
  /* Deliberately long titles, because the layout exists for them — a running
     one (which the chip row also carries), and idle ones that live in the list,
     where the two lines are the whole point. */
  const THREADS = [
    { t: "for the excel clean up it use the main chat completion like", p: "harness", s: "running", when: "2m ago", active: true },
    { t: "Index the rules table", p: "harness", s: "waiting", when: "4m ago", asks: "Which table should the index go on?" },
    { t: "Pricing page copy", p: "website", s: "waiting", when: "22m ago", asks: "Two headline candidates — which one?" },
    { t: "PM2 fork mode", p: "infra", s: "failed", when: "1h ago", err: "spawn EACCES" },
    { t: "Rewrite the replay window so a load_earlier page keeps its own usage", p: "harness", s: "idle", when: "6h ago" },
    { t: "Make the sink tool call diff the sink rather than the compiled output", p: "website", s: "idle", when: "8h ago" },
    { t: "Replay coalescing", p: "harness", s: "idle", when: "9h ago" },
    { t: "Trim the OG images", p: "website", s: "idle", when: "5h ago" },
    { t: "Terminal key row", p: "harness", s: "idle", when: "9h ago" },
    { t: "Onboarding rewrite", p: "docs", s: "idle", when: "1d ago" },
    { t: "Backup import", p: "infra", s: "idle", when: "1d ago" },
    { t: "Scratch — bridge profiling", p: "harness", s: "idle", when: "2d ago" },
  ]
  const proj = (id) => PROJECTS.find((p) => p.id === id) || PROJECTS[0]
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))
  const dot = (s) => (s === "idle" ? "" : `<span class="dot ${s}"></span>`)
  const isToday = (w) => /^(now|[\d]+m ago|[\d]+h ago)$/.test(w)
  const pin = THREADS.filter((t) => t.active)

  document.getElementById("new").innerHTML =
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New thread<kbd>⌘N</kbd>`
  document.getElementById("search").innerHTML =
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search<kbd>⌘K</kbd>`
  document.getElementById("chips").innerHTML = pin
    .map((t) => `<button class="chip">${dot(t.s)}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.t)}</span></button>`).join("")

  /* The row. The meta line is the project and the time — or, when the thread is
     waiting on you, the question itself, because that is what the line is for. */
  const row = (t) => {
    const p = proj(t.p)
    const ask = t.s === "waiting" && t.asks
    const bad = t.s === "failed" && t.err
    return `
      <button class="row" data-active="${!!t.active}">
        <span class="title">${esc(t.t)}</span>
        <span class="status">${dot(t.s)}</span>
        <span class="meta ${ask ? "ask" : ""}">
          ${ask || bad ? `<span class="p">${esc(ask || bad)}</span>` : `
            <span class="p">${esc(p.name)}</span>
            <span class="sep">·</span>
            <span class="when">${t.when}</span>`}
        </span>
      </button>`
  }

  const tier = (label, rows) => rows.length
    ? `<div class="tier">${label}<span class="n">${rows.length}</span></div>${rows.map(row).join("")}`
    : ""

  const rest = THREADS.filter((t) => !t.active)
  const folder = (p) => {
    const mine = THREADS.filter((t) => t.p === p.id)
    const open = !["docs"].includes(p.id)
    return `
      <button class="folder" data-fold="${p.id}" aria-expanded="${open}">
        <span class="mark" style="background:oklch(0.55 0.18 ${p.hue})">${p.initial}</span>
        <span class="name">${esc(p.name)}</span>
        <span class="sub">${mine.length} thread${mine.length === 1 ? "" : "s"}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <div class="tree" data-folded="${p.id}" ${open ? "" : "hidden"}>${mine.map(row).join("")}</div>`
  }

  document.getElementById("scroll").innerHTML =
    tier("Needs you", rest.filter((t) => t.s === "waiting" || t.s === "failed")) +
    tier("Today", rest.filter((t) => t.s !== "waiting" && t.s !== "failed" && isToday(t.when))) +
    tier("Yesterday", rest.filter((t) => t.s !== "waiting" && t.s !== "failed" && t.when === "1d ago")) +
    `<div class="tier">Projects<span class="n">${PROJECTS.length}</span></div>` +
    PROJECTS.map(folder).join("")

  document.getElementById("foot").innerHTML = `
    <div class="foot-nav">
      <button class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="11" rx="1"/></svg>Tasks</button>
      <button class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>Routines<span class="n">3</span></button>
      <button class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Scheduled</button>
    </div>
    <button class="frow"><span class="sub">This machine</span><span style="margin-left:auto" class="dot running"></span></button>`

  for (const f of document.querySelectorAll(".folder[data-fold]")) {
    f.addEventListener("click", () => {
      const open = f.getAttribute("aria-expanded") === "true"
      f.setAttribute("aria-expanded", String(!open))
      document.querySelector(`[data-folded="${f.dataset.fold}"]`).hidden = open
    })
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "d" && !e.metaKey && !e.ctrlKey) document.documentElement.classList.toggle("dark")
  })
</script>
</body>
</html>
