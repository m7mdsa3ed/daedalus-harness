<!doctype html>
<!--
  T9 — Prompt anchored.

  The third answer to "where does your message belong". T3 gave it the top of a
  turn's card and T7 gave it a node on a spine. Here it gets the *left*: your
  prompt is a fixed 28% column, and everything it caused runs down the 72% to
  its right, aligned with it. Two turns stack as two such rows.

  What it costs: the column is permanently spent on the prompt's own words, and
  the agent's answer — usually the longer of the two — gets the smaller share.
  What it buys: the question and the answer are never confusable, and a long
  thread can be scanned by its left edge alone.
-->
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<title>T9 — Prompt anchored</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./transcript.css" />
<style>
  :root { --dock-h: 220px; }
  .col { max-width: 900px; }
  .turn { display: grid; grid-template-columns: 232px 1fr; gap: 28px; padding: 16px 0; border-top: 1px solid var(--border-60); }
  .turn:first-child { border-top: 0; padding-top: 6px; }
  .aside { position: relative; padding-left: 14px; }
  .aside::before { content: ""; position: absolute; left: 0; top: 3px; bottom: 3px; width: 2px; border-radius: 999px; background: color-mix(in oklab, var(--primary) 45%, transparent); }
  .aside .who { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: color-mix(in oklab, var(--muted-foreground) 85%, transparent); }
  .aside .who .av { width: 16px; height: 16px; border-radius: 5px; background: color-mix(in oklab, var(--muted) 80%, transparent); display: grid; place-items: center; font-size: 8px; }
  .aside .words { margin-top: 8px; font-size: 0.875rem; line-height: 1.6; }
  .aside .words code { font-family: ui-monospace, Menlo, monospace; font-size: 0.8125rem; background: var(--muted); padding: 0.1em 0.35em; border-radius: 5px; }
  .aside .at { margin-top: 8px; font-size: 11px; color: var(--muted-foreground); }
  .turn[data-live] .aside::before { background: color-mix(in oklab, var(--green) 70%, transparent); }
  .aside .live { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; font-size: 11px; color: var(--green); }
  .aside .live .dot { width: 6px; height: 6px; }
  .work { min-width: 0; }
  .work > *:first-child { margin-top: 0; }
  .todos .todo { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--muted-foreground); padding: 2px 0; }
  .todos .box { width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--muted-foreground) 50%, transparent); display: grid; place-items: center; }
  .todos .box svg { width: 9px; height: 9px; }
  .todos .todo[data-done="true"] .box { background: var(--primary); color: var(--primary-foreground); box-shadow: none; }
  .todos .todo[data-done="true"] .txt { text-decoration: line-through; opacity: 0.55; }
  .todos .todo[data-active="true"] .txt { color: var(--foreground); }
  @media (max-width: 980px) { .turn { grid-template-columns: 1fr; gap: 10px; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" data-sidebar></aside>
  <main class="main">
    <div data-tabs></div>
    <div class="panel">
      <div class="tv">
        <div class="tv-scroll"><div class="col" data-flow></div></div>
        <div data-dock></div>
      </div>
    </div>
  </main>
</div>
<script src="./shared-transcript.js"></script>
<script>
  const rows = TX.flow()
  const { esc, I } = TX
  const userRows = rows.filter((r) => r.t === "user")
  const i0 = rows.indexOf(userRows[0])
  const i1 = rows.indexOf(userRows[1])

  const turn = (head, body, opts) => `
    <section class="turn"${(opts || {}).live ? " data-live" : ""}>
      <div class="aside">
        <div class="who"><span class="av">Y</span>You</div>
        <div class="words">${esc(head.text).replace(/`([^`]+)`/g, "<code>$1</code>")}</div>
        ${(opts || {}).live ? `<div class="live"><span class="dot running"></span>working</div>` : `<div class="at">${esc(head.at || "")}</div>`}
      </div>
      <div class="work">${body.map((r) => TX.render([r])).join("")}</div>
    </section>`

  document.querySelector("[data-tabs]").innerHTML = TX.tabs("Ship the composer width fix")
  document.querySelector("[data-flow]").innerHTML =
    turn(rows[i0], rows.slice(i0 + 1, i1)) + turn(rows[i1], rows.slice(i1 + 1), { live: true })
  document.querySelector("[data-dock]").innerHTML = TX.composer({ placeholder: "Reply…", queue: ["and check it at 320px too"] })
  TX.sidebar(document.querySelector("[data-sidebar]"))
  TX.theme()
</script>
</body>
</html>
