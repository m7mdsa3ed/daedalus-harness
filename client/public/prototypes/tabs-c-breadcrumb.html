<!doctype html>
<!--
  Tabs-C — Breadcrumb strip. One location, not a row of tabs.

  The strip stops being a set of tabs and becomes a path: the sidebar opens
  places, and the header says which place you are in and what is inside it —
  `daedalus-harness / Ship the composer width fix / Plan`. Ancestors are
  clickable and go up; the leaf is what you are looking at. There is no tab to
  close, because a place is not a thing you keep (the app's own rule for page
  panels), and the dock's six kinds stop competing for width.

  What it costs: you can only be in one place at a time. There is no docked
  terminal beside a thread, no second transcript, no split — this is the option
  that trades the workspace back for a browser.
-->
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<title>Tabs-C — Breadcrumb strip</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./transcript.css" />
<link rel="stylesheet" href="./tabs.css" />
<style>
  .crumbs { border-bottom: 1px solid var(--border-60); background: color-mix(in oklab, var(--card) 92%, transparent); }
  .crumbs .crumb .sep { margin-left: 2px; }
  .crumbs .trail { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; }
  .crumbs .controls { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .crumbs .ctrl { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; color: var(--muted-foreground); }
  .crumbs .ctrl:hover { background: var(--hover); color: var(--foreground); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" data-sidebar></aside>
  <main class="main">
    <div class="panel">
      <div class="crumbs">
        <span class="trail" id="trail"></span>
        <span class="controls">
          <button class="ctrl" title="Split with a terminal">${"+"}</button>
          <button class="ctrl" title="Open in a new window">${"↗"}</button>
          <button class="ctrl" title="Search this place">${"⌕"}</button>
        </span>
      </div>
      <div class="tv">
        <div class="tv-scroll"><div class="col" data-flow></div></div>
        <div data-dock></div>
      </div>
    </div>
  </main>
</div>
<script src="./shared-transcript.js"></script>
<script src="./shared-tabs.js"></script>
<script src="./shared-composer.js"></script>
<script>
  const { I } = TB
  const chain = [
    { label: "daedalus-harness", icon: I.web },
    { label: "Ship the composer width fix", icon: I.chat, active: true },
    { label: "Plan", icon: I.list, leaf: true },
  ]
  document.querySelector("#trail").innerHTML = chain
    .map(
      (c, i) =>
        `${i ? `<span class="sep">${I.chev}</span>` : ""}<button class="crumb"${c.active ? " data-active" : ""}>${
          c.icon ? `<span class="mark">${c.icon}</span>` : ""
        }${c.label}</button>`
    )
    .join("")
  /* The trail is the only chrome; a "+" opens a place from the sidebar rather
     than a tab in the strip. */
  document.querySelectorAll(".crumbs .ctrl")[0].textContent = ""
  document.querySelectorAll(".crumbs .ctrl")[0].innerHTML = I.plus
  document.querySelector("[data-flow]").innerHTML = TX.render(TX.flow())
  document.querySelector("[data-dock]").innerHTML = TX.composer({ placeholder: "Reply…", shelf: "todos" })
  TX.sidebar(document.querySelector("[data-sidebar]"))
  TX.theme()
</script>
</body>
</html>
