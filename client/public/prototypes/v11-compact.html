<!doctype html>
<!--
  v11 — Compact. The same index as v2, drawn for a sidebar you keep narrow: a
  tighter vertical rhythm (26px rows, no tier gaps), so a window that fits eight
  threads in v2 fits fourteen here, and the fixed nav shrinks to a second icon
  row under the brand instead of seven full-width rows.

  It is the "give me density" answer: nothing is moved between tiers or hidden
  behind a hover that was not already, the panel is simply smaller. It is also
  the most sensitive to the theme's own spacing, so it is the one to look at
  beside v2 to judge whether the current panel is airy or wasteful.
-->
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<title>v11 — Compact</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --radius: 0.625rem; --radius-xl: calc(var(--radius) * 1.4);
    --background: oklch(1 0 0); --foreground: oklch(0.145 0 0); --card: oklch(1 0 0);
    --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.556 0 0); --primary: oklch(0.205 0 0);
    --sidebar: var(--background); --sidebar-foreground: oklch(0.145 0 0);
    --sidebar-accent: oklch(0.9 0 0); --sidebar-border: oklch(0.91 0 0);
    --app-ground: oklch(0.97 0 0); --amber: oklch(0.769 0.188 70.08);
    --green: oklch(0.723 0.219 149.579); --destructive: oklch(0.577 0.245 27.325);
    --blue: oklch(0.707 0.165 254.624); --violet: oklch(0.606 0.25 292.717);
    --row-h: 26px;
  }
  html.dark {
    --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0); --card: oklch(0.205 0 0);
    --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0); --primary: oklch(0.922 0 0);
    --sidebar: var(--background); --sidebar-foreground: oklch(0.985 0 0);
    --sidebar-accent: oklch(0.269 0 0); --sidebar-border: oklch(1 0 0 / 10%);
    --app-ground: oklch(0.12 0 0);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Figtree", ui-sans-serif, system-ui, sans-serif; font-size: 12.5px; line-height: 1.32;
    color: var(--foreground); background: var(--app-ground); -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { width: 15px; height: 15px; flex: 0 0 auto; }
  [hidden] { display: none !important; }

  .app { display: flex; height: 100vh; overflow: hidden; }
  .sidebar {
    --w: 240px; width: var(--w); min-width: 180px; max-width: 400px; flex: 0 0 auto;
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--sidebar); border-right: 1px solid var(--sidebar-border);
  }
  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; padding: 6px 6px 6px 0; }
  .tabs { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 4px; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 10px;
    border-radius: 8px; color: var(--muted-foreground); box-shadow: inset 0 0 0 1px var(--sidebar-border);
  }
  .tab[data-active="true"] { color: var(--foreground); background: var(--card); box-shadow: inset 2px 0 0 0 var(--primary), 0 1px 2px rgba(0,0,0,.12); }
  .card { flex: 1 1 auto; border-radius: var(--radius-xl); background: var(--card); display: grid; place-items: center; color: var(--muted-foreground); font-size: 12px; }

  /* ── The head, at the compact rhythm ──
     The brand row, then one *row of icon buttons* for the fixed nav: seven
     32px rows of chrome become one, and the label each one lost is its tooltip
     and its `sr-only`. The sidebar's own width is what the labels were costing;
     at 240px they truncated the titles under them anyway. */
  .head { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; padding: 8px 8px 0; }
  .brand { width: 24px; height: 24px; border-radius: 7px; flex: 0 0 auto; display: grid; place-items: center; color: white;
    background: linear-gradient(140deg, var(--violet), var(--blue)); }
  .brand svg { width: 13px; height: 13px; }
  .head .title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; margin-left: 4px; }
  .head .spacer { flex: 1 1 auto; }
  .icon-btn { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--muted-foreground); }
  .icon-btn:hover { background: var(--sidebar-accent); color: var(--sidebar-foreground); }
  .nav-row { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; padding: 6px 6px 0; }
  .nav-btn { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 7px; border-radius: 7px; color: var(--muted-foreground); font-size: 12px; }
  .nav-btn:hover { background: var(--sidebar-accent); color: var(--sidebar-foreground); }
  .nav-btn .n { font-size: 10px; font-variant-numeric: tabular-nums; opacity: 0.8; }
  .nav-btn.primary { background: var(--sidebar-accent); color: var(--sidebar-foreground); font-weight: 500; }
  .search { display: flex; align-items: center; gap: 7px; height: 28px; margin: 6px 8px 0; padding: 0 8px; border-radius: 7px;
    color: var(--muted-foreground); box-shadow: inset 0 0 0 1px var(--sidebar-border); font-size: 12px; }
  .search:hover { background: var(--sidebar-accent); }
  kbd { font: inherit; font-size: 10px; padding: 1px 4px; border-radius: 3px; margin-left: auto; color: var(--muted-foreground); background: var(--muted); }

  .chip-row { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 3px; padding: 6px 8px 0; }
  .chip { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; height: 22px; padding: 0 8px 0 6px;
    border-radius: 999px; font-size: 11.5px; background: var(--muted); }
  .chip .dot { width: 5px; height: 5px; }

  .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 3px 6px 8px; }
  .scroll::-webkit-scrollbar { width: 7px; }
  .scroll::-webkit-scrollbar-thumb { background: color-mix(in oklab, var(--foreground) 18%, transparent); border-radius: 999px; }

  /* The tier label is smaller and shorter than the panel's at rest, and it
     appears only where it earns its line — a one-line tier has none. */
  .tier { display: flex; align-items: center; gap: 5px; height: 20px; margin-top: 6px; padding: 0 8px;
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: color-mix(in oklab, var(--sidebar-foreground) 48%, transparent); }
  .tier:first-child { margin-top: 2px; }
  .tier .n { margin-left: auto; letter-spacing: 0; font-weight: 600; opacity: 0.7; }

  .row { display: flex; align-items: center; gap: 7px; width: 100%; height: var(--row-h); padding: 0 8px; border-radius: 7px; text-align: left; }
  .row:hover { background: var(--sidebar-accent); }
  .row[data-active="true"] { background: var(--sidebar-accent); font-weight: 500; }
  .row .title { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .tail { margin-left: auto; display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
  .row .sub { font-size: 10.5px; color: var(--muted-foreground); }
  .row .dot { width: 6px; height: 6px; border-radius: 999px; }
  .row.ask { background: color-mix(in oklab, var(--amber) 8%, transparent); }
  .row.ask:hover { background: color-mix(in oklab, var(--amber) 14%, transparent); }
  .row.bad { background: color-mix(in oklab, var(--destructive) 8%, transparent); }
  .dot.running { background: var(--green); animation: pulse 1.6s ease-in-out infinite; }
  .dot.waiting { background: var(--amber); }
  .dot.failed { background: var(--destructive); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--muted-foreground); }
  .tag i { width: 6px; height: 6px; border-radius: 999px; display: block; }

  .folder { display: flex; align-items: center; gap: 6px; width: 100%; height: var(--row-h); padding: 0 8px; border-radius: 7px; text-align: left; }
  .folder:hover { background: var(--sidebar-accent); }
  .folder .mark { width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; color: white; font-size: 9px; font-weight: 700; }
  .folder .name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folder .n { font-size: 10.5px; color: var(--muted-foreground); }

  .foot { flex: 0 0 auto; display: flex; align-items: center; gap: 2px; padding: 5px 6px 7px; border-top: 1px solid var(--sidebar-border); }
  .foot .grow { flex: 1 1 auto; }
  .foot .who { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 7px; border-radius: 7px; color: var(--muted-foreground); font-size: 11.5px; }
  .foot .who:hover { background: var(--sidebar-accent); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header class="head">
      <span class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M12 12v10"/></svg></span>
      <span class="title">Threads</span>
      <span class="spacer"></span>
      <button class="icon-btn" title="New thread"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" title="Sort and filter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5h18M6 12h12M10 19h4"/></svg></button>
    </header>

    <!-- One row where the fixed nav used to be seven: glyph, label, count. -->
    <nav class="nav-row" id="nav"></nav>
    <button class="search" id="search"></button>
    <div class="chip-row" id="chips"></div>
    <div class="scroll" id="scroll"></div>
    <footer class="foot" id="foot"></footer>
  </aside>

  <main class="main">
    <div class="tabs">
      <button class="tab" data-active="true"><span class="dot" style="width:6px;height:6px;border-radius:999px;background:var(--green)"></span>Ship the composer width fix</button>
      <button class="tab">Index the rules table</button>
      <button class="tab" style="width:30px;padding:0;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="card">the dock — the transcript in front of you</div>
  </main>
</div>

<script>
  const PROJECTS = [
    { id: "harness", name: "daedalus-harness", short: "harness", hue: 292, initial: "D" },
    { id: "website", name: "marketing-site", short: "site", hue: 210, initial: "M" },
    { id: "infra", name: "infra", short: "infra", hue: 150, initial: "I" },
    { id: "docs", name: "handbook", short: "docs", hue: 60, initial: "H" },
  ]
  const THREADS = [
    { t: "Ship the composer width fix", p: "harness", s: "running", when: "now", active: true },
    { t: "Index the rules table", p: "harness", s: "waiting", when: "4m" },
    { t: "Pricing page copy", p: "website", s: "waiting", when: "22m" },
    { t: "PM2 fork mode", p: "infra", s: "failed", when: "1h" },
    { t: "Replay coalescing", p: "harness", s: "idle", when: "3h" },
    { t: "Trim the OG images", p: "website", s: "idle", when: "5h" },
    { t: "Terminal key row", p: "harness", s: "idle", when: "9h" },
    { t: "Onboarding rewrite", p: "docs", s: "idle", when: "1d" },
    { t: "Backup import", p: "infra", s: "idle", when: "1d" },
    { t: "Scratch — bridge profiling", p: "harness", s: "idle", when: "2d" },
    { t: "Session journal replay", p: "harness", s: "idle", when: "2d" },
    { t: "Font subsetting", p: "website", s: "idle", when: "4d" },
  ]
  const proj = (id) => PROJECTS.find((p) => p.id === id) || PROJECTS[0]
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))
  const isToday = (w) => /^(now|\d+m|\d+h)$/.test(w)
  const dot = (s) => (s === "idle" ? "" : `<span class="dot ${s}"></span>`)
  const tag = (id) => { const p = proj(id); return `<span class="tag"><i style="background:oklch(0.62 0.17 ${p.hue})"></i>${p.short}</span>` }
  const I = {
    board: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="11" rx="1"/></svg>`,
    bolt: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>`,
    cal: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>`,
    search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`,
    gear: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`,
  }

  document.getElementById("nav").innerHTML = `
    <button class="nav-btn primary">${I.board}<span>Tasks</span></button>
    <button class="nav-btn">${I.bolt}<span class="n">3</span></button>
    <button class="nav-btn">${I.cal}</button>`
  document.getElementById("search").innerHTML = I.search + `Search<kbd>⌘K</kbd>`

  const needs = THREADS.filter((t) => t.s === "waiting" || t.s === "failed")
  const pinned = THREADS.filter((t) => t.active)
  const rest = THREADS.filter((t) => !pinned.includes(t))

  document.getElementById("chips").innerHTML = pinned
    .map((t) => `<button class="chip">${dot(t.s)}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.t)}</span></button>`).join("")

  /* A tier with one row is a heading that costs a line for one name, so the
     heading is drawn only where it has something to separate. */
  const tier = (label, rows) => rows.length
    ? `<div class="tier">${label}<span class="n">${rows.length}</span></div>${rows.map((t) => `
        <button class="row ${t.s === "waiting" ? "ask" : t.s === "failed" ? "bad" : ""}" data-active="${!!t.active}">
          <span class="title">${esc(t.t)}</span>
          <span class="tail">${tag(t.p)}<span class="sub">${t.when}</span></span>
        </button>`).join("")}`
    : ""

  document.getElementById("scroll").innerHTML =
    tier("Needs you", needs) +
    tier("Today", rest.filter((t) => isToday(t.when))) +
    tier("Yesterday", rest.filter((t) => t.when === "1d")) +
    tier("Earlier", rest.filter((t) => !isToday(t.when) && t.when !== "1d")) +
    `<div class="tier">Projects<span class="n">${PROJECTS.length}</span></div>` +
    PROJECTS.map((p) => `
      <button class="folder">
        <span class="mark" style="background:oklch(0.55 0.18 ${p.hue})">${p.initial}</span>
        <span class="name">${esc(p.name)}</span>
        <span class="n">${THREADS.filter((t) => t.p === p.id).length}</span>
      </button>`).join("")

  document.getElementById("foot").innerHTML = `
    <button class="who"><span class="dot running"></span>This machine</button>
    <span class="grow"></span>
    <button class="icon-btn" title="Settings">${I.gear}</button>`

  document.addEventListener("keydown", (e) => {
    if (e.key === "d" && !e.metaKey && !e.ctrlKey) document.documentElement.classList.toggle("dark")
  })
</script>
</body>
</html>
