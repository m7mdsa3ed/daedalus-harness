<!doctype html>
<!--
  T4 — Work first. The inverse of T2.

  A coding thread is a sequence of *actions*; the prose is commentary on them.
  So the actions get the column — the gutter rail is pulled wide, the step
  titles are set larger and in the foreground, and the diffs are open where
  they fall — while the agent's prose steps back to one tone quieter and
  slightly smaller, the way a caption would.

  What it costs: the conversation is no longer the thing you read; you read
  what happened to the code. What it buys: a review of a long turn, where the
  file list and the diffs are the reading and "I'll fix it where it's
  declared" is a sentence you skim on the way past.
-->
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<title>T4 — Work first</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./transcript.css" />
<style>
  :root { --dock-h: 220px; }
  /* The agent's prose, demoted to a caption. */
  .a-msg { padding: 5px 0; }
  .a-msg .prose { font-size: 0.8125rem; line-height: 1.55; color: var(--muted-foreground); }
  /* The steps, promoted: a wide rail and a readable title. */
  .step .title { font-size: 0.8125rem; color: var(--foreground); }
  .step .mark { width: 16px; }
  .step .meta { color: var(--muted-foreground); }
  .step .step-rowz { margin: 0; width: 100%; padding: 3px 0; }
  .step.expandable:hover .step-rowz, .step[data-open] .step-rowz { background: color-mix(in oklab, var(--foreground) 4%, transparent); margin: 0 -8px; width: calc(100% + 16px); padding: 3px 8px; }
  .rail { border-left-width: 1.5px; margin-left: 7px; padding-left: 12px; }
  /* A run's header reads as a section heading. */
  .run-head .sum { font-size: 0.75rem; font-weight: 500; color: var(--foreground); letter-spacing: -0.01em; }
  /* The plan is a flat list here, ticked in the gutter. */
  .card { box-shadow: none; }
  .todos .todo { display: flex; align-items: center; gap: 8px; font-size: 0.8125rem; color: var(--muted-foreground); padding: 3px 0; }
  .todos .box { width: 15px; height: 15px; border-radius: 5px; box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--muted-foreground) 50%, transparent); display: grid; place-items: center; }
  .todos .box svg { width: 10px; height: 10px; }
  .todos .todo[data-done="true"] .box { background: var(--primary); color: var(--primary-foreground); box-shadow: none; }
  .todos .todo[data-done="true"] .txt { text-decoration: line-through; opacity: 0.55; }
  .todos .todo[data-active="true"] { color: var(--foreground); }
  /* Your message is a rule, not a bubble: this is not a chat. */
  .u-bubble { background: color-mix(in oklab, var(--muted) 70%, transparent); border-radius: 10px; padding: 8px 12px; }
  html.dark .u-bubble { background: color-mix(in oklab, var(--muted) 60%, transparent); }
  .u-msg { align-items: stretch; }
  .u-bubble { max-width: 100%; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" data-sidebar></aside>
  <main class="main">
    <div data-tabs></div>
    <div class="panel">
      <div class="tv">
        <div class="tv-scroll"><div class="col" data-flow></div></div>
        <div data-dock></div>
      </div>
    </div>
  </main>
</div>
<script src="./shared-transcript.js"></script>
<script>
  const rows = TX.flow()
  document.querySelector("[data-tabs]").innerHTML = TX.tabs("Ship the composer width fix")
  /* Runs open: the diffs and the commands are the reading here. */
  document.querySelector("[data-flow]").innerHTML = TX.render(rows, { runs: () => true })
  document.querySelector("[data-dock]").innerHTML = TX.composer({ placeholder: "Reply…", queue: ["and check it at 320px too"] })
  TX.sidebar(document.querySelector("[data-sidebar]"))
  TX.theme()
</script>
</body>
</html>
