<!doctype html>
<!--
  T1 — Current column. The baseline, built from the app's real vocabulary so
  every other option can be read as a difference from it.

  One 748px column, centred on the panel. Your message is a tinted bubble
  against the end edge at 80%; the agent's prose sits on the page ground with
  no bubble; every step is one 24px line box with its mark in the gutter and
  its readings pushed to the right edge; the composer is a frosted card docked
  over the foot, and the transcript reserves its height.

  Nothing here is a proposal. It is the layout the variants argue with.
-->
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<title>T1 — Current column</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./transcript.css" />
<style>
  :root { --dock-h: 220px; }
  .dock { padding-bottom: 14px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" data-sidebar></aside>
  <main class="main">
    <div data-tabs></div>
    <div class="panel">
      <div class="tv">
        <div class="tv-scroll"><div class="col" data-flow></div></div>
        <div data-dock></div>
      </div>
    </div>
  </main>
</div>
<script src="./shared-transcript.js"></script>
<script>
  const rows = TX.flow()
  document.querySelector("[data-tabs]").innerHTML = TX.tabs("Ship the composer width fix")
  document.querySelector("[data-flow]").innerHTML = TX.render(rows)
  document.querySelector("[data-dock]").innerHTML = TX.composer({ placeholder: "Reply…", ready: false })
  TX.sidebar(document.querySelector("[data-sidebar]"))
  TX.theme()
</script>
</body>
</html>
