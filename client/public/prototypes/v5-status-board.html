<!doctype html>
<!-- v5 — The status board. The sidebar answers one question first: what is
     waiting on me? Two full groups — Needs you and Running — with the action on
     the row itself, then a compact "Everything else" recents list. The most
     different from the current sidebar, and the best answer to "I have twelve
     threads and cannot tell which need me". Cost: the projects are a fold at
     the bottom rather than a first-class tree. -->
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<title>v5 — Status board</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./shared.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" style="--w:288px">
    <header class="sb-head">
      <div class="sb-title-row">
        <h2>Threads</h2>
        <div class="head-actions">
          <button class="icon-btn" data-new></button>
          <button class="icon-btn" data-filter></button>
        </div>
      </div>
      <button class="search" id="search"></button>
    </header>
    <div class="scroll" id="scroll"></div>
    <footer class="sb-foot" id="foot"></footer>
  </aside>
  <main class="main">
    <div class="tabs">
      <button class="tab" data-active="true"><span class="dot running"></span>Ship the composer width fix</button>
      <button class="tab">Index the rules table</button>
      <button class="tab" style="width:30px;padding:0;justify-content:center" id="add-tab"></button>
    </div>
    <div class="card">the dock — the transcript in front of you</div>
  </main>
</div>
<script src="./shared.js"></script>
<script>
  const { data, HTML, esc, dot, on, folds, theme, render, ICONS } = PROTO
  const { projects, threads } = data()
  const byId = (id) => threads.find((t) => t.id === id)

  document.querySelector("[data-new]").innerHTML = ICONS.plus
  document.querySelector("[data-filter]").innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5h18M6 12h12M10 19h4"/></svg>`
  document.getElementById("add-tab").innerHTML = ICONS.plus
  document.getElementById("search").innerHTML = ICONS.search + " Search<kbd>⌘K</kbd>"

  const needs = threads.filter((t) => t.s === "waiting" || t.s === "failed")
  const running = threads.filter((t) => t.s === "running")
  const rest = threads.filter((t) => t.s === "idle")

  /* A needs-you row carries the action, because the whole point of the group is
     that answering is the next thing you do. */
  const row = (t, opts = {}) => HTML`
    <div class="row ${t.s === "waiting" ? "ask" : t.s === "failed" ? "bad" : ""}" data-active="${!!t.active}">
      <span class="title">${esc(t.t)}</span>
      <span class="tail">
        ${opts.act && t.s === "waiting" ? HTML`<button class="act" data-no-activate>Answer</button>` : ""}
        ${opts.act && t.s === "failed" ? HTML`<button class="act danger" data-no-activate>Retry</button>` : ""}
        ${opts.act && t.s === "running" ? HTML`<button class="act" data-no-activate>Open</button>` : ""}
        ${!opts.act ? dot(t.s) + HTML`<span class="sub">${t.when}</span>` : ""}
      </span>
    </div>
    ${opts.why && t.asks ? HTML`<p class="sub" style="padding:0 8px 6px 23px;margin:-4px 0 2px">${esc(t.asks)}</p>` : ""}
    ${opts.why && t.err ? HTML`<p class="sub" style="padding:0 8px 6px 23px;margin:-4px 0 2px">${esc(t.err)}</p>` : ""}`

  const html = HTML`
    <div class="section">
      <div class="section-head">${ICONS.inbox}Needs you<span class="n">${needs.length}</span></div>
      ${needs.map((t) => row(t, { act: true, why: true })).join("")}
    </div>
    <div class="section">
      <div class="section-head">Running<span class="n">${running.length}</span></div>
      ${running.map((t) => row(t, { act: true })).join("")}
    </div>
    <div class="section">
      <div class="section-head">Everything else<span class="n">${rest.length}</span></div>
      ${rest.map((t) => row(t)).join("")}
    </div>
    <div class="section">
      <div class="section-head clickable" data-fold="projects" aria-expanded="true">${ICONS.folder}Projects<span class="n">${projects.length}</span>${ICONS.chev}</div>
      <div data-folded="projects" style="margin-top:2px">
        ${projects.map((p) => HTML`
          <button class="folder">
            <span class="mark" style="background:oklch(0.55 0.18 ${p.hue})">${p.initial}</span>
            <span class="name">${esc(p.name)}</span><span class="n">${p.count}</span>
          </button>`).join("")}
      </div>
    </div>`

  render(document.getElementById("scroll"), html)
  document.getElementById("foot").innerHTML = HTML`
    <div class="foot-nav">
      <button class="nav-link">${ICONS.board}Tasks</button>
      <button class="nav-link">${ICONS.bolt}Routines<span class="n">3</span></button>
      <button class="nav-link">${ICONS.calendar}Scheduled</button>
    </div>
    <button class="row"><span class="sub">This machine</span><span class="tail"><span class="dot running"></span></span></button>`
  theme()
</script>
</body>
</html>
