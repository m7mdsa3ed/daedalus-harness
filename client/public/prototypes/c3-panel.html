<!doctype html>
<!--
  C3 — The composer panel. A bigger card for a busier shelf.

  The composer gets a header row of its own — the subjects that would otherwise
  be piled as slivers (Queue, Files, Plan, History) become tabs of the card,
  with their counts — and the textarea sits under whichever is open. The
  readings move down into the same row as the project, and the toolbar keeps
  only the "+", the model and Send.

  This is the option for a thread where the shelf is always doing something. A
  pile answers "what else is on the shelf" by being looked at; a row of named
  tabs answers it by being read — which is worth the width when there are
  three or four cards and never worth it when there is one.
-->
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<title>C3 — Composer panel</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./transcript.css" />
<link rel="stylesheet" href="./composer.css" />
<style>
  :root { --dock-h: 232px; }
  .tv { position: absolute; inset: 0; }
  .tv .col { opacity: 0.4; mask-image: linear-gradient(to bottom, #000, #000 45%, transparent 96%); -webkit-mask-image: linear-gradient(to bottom, #000, #000 45%, transparent 96%); }
  .cmp-card { padding: 10px 10px 8px; }
  .cmp-toolbar { padding-top: 2px; }
  .cmp-foot { padding-top: 8px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" data-sidebar></aside>
  <main class="main">
    <div data-tabs></div>
    <div class="panel">
      <div class="tv">
        <div class="tv-scroll"><div class="col" data-flow></div></div>
        <div data-dock></div>
      </div>
      <div class="note left" style="right:14px; top:22%"><b>Named tabs</b> — the pile, read instead of looked at. Worth it at four cards, not at one.</div>
      <div class="note left" style="right:14px; top:56%"><b>Readings</b> — moved into the footer, beside the project.</div>
    </div>
  </main>
</div>
<script src="./shared-transcript.js"></script>
<script src="./shared-composer.js"></script>
<script>
  const { I, cards } = CX
  const tab = (label, on, n) =>
    `<button class="ptab" data-on="${!!on}">${label}${n ? `<span class="n">${n}</span>` : ""}</button>`

  document.querySelector("[data-tabs]").innerHTML = TX.tabs("Ship the composer width fix")
  document.querySelector("[data-flow]").innerHTML = TX.render(TX.flow())
  document.querySelector("[data-dock]").innerHTML = `
    <div class="cmp">
      <div class="dock">
        <div class="cmp-card">
          <div class="panel-tabs">
            ${tab("Queue", true, 1)}${tab("Files", false, 2)}${tab("Plan", false, "3/4")}${tab("History", false)}
            <span class="spacer" style="flex:1"></span>
            <button class="ctrl" style="opacity:.6" title="Fold">${CX.I.more}</button>
          </div>
          <div class="shelf-card" style="background:transparent;border-radius:0;padding:0 2px 8px">
            ${cards.queue.body}
          </div>
          <div class="cmp-text" style="min-height:30px;padding:4px 6px 2px">Message the agent…</div>
          <div class="cmp-toolbar">
            <button class="rnd disc" title="Add">${TX.I.plus}</button>
            <button class="model" title="Model and effort">claude-sonnet-4</button>
            <span class="spacer" style="flex:1"></span>
            <button class="rnd" title="Voice">${I.mic}</button>
            <button class="rnd send" title="Send">${I.send}</button>
          </div>
          <div class="cmp-foot">
            <button class="fpill" title="Project">${CX.project()}</button>
            <button class="fpill" title="Tools">${I.wrench}Tools<span style="opacity:.6">3</span></button>
            ${CX.readings({ config: true, todos: "3/4", agents: 2, files: 3 })}
          </div>
        </div>
      </div>
    </div>`
  TX.sidebar(document.querySelector("[data-sidebar]"))
  TX.theme()
</script>
</body>
</html>
