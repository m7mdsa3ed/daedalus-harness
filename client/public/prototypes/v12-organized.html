<!doctype html>
<!--
  v12 — Organized. The v2 index with the reading made explicit: threads are the
  front page, and the project tree is a *destination* the header switches to,
  rather than a tier that has to share the same scroll with the list. A small
  segmented control in the header moves between Threads and Projects; the chip
  row of pins and the footer are the same as v2's.

  It is the answer for someone whose projects are many and whose threads are
  few: the two lists stop competing for the one scroll, and neither is the
  other's fold state. Cost: one click to change which list you are reading,
  where v2 shows both at once.
-->
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<title>v12 — Organized</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --radius: 0.625rem; --radius-xl: calc(var(--radius) * 1.4);
    --background: oklch(1 0 0); --foreground: oklch(0.145 0 0); --card: oklch(1 0 0);
    --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.556 0 0); --primary: oklch(0.205 0 0);
    --sidebar: var(--background); --sidebar-foreground: oklch(0.145 0 0);
    --sidebar-accent: oklch(0.9 0 0); --sidebar-border: oklch(0.91 0 0);
    --app-ground: oklch(0.97 0 0); --amber: oklch(0.769 0.188 70.08);
    --green: oklch(0.723 0.219 149.579); --destructive: oklch(0.577 0.245 27.325);
    --blue: oklch(0.707 0.165 254.624); --violet: oklch(0.606 0.25 292.717);
  }
  html.dark {
    --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0); --card: oklch(0.205 0 0);
    --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0); --primary: oklch(0.922 0 0);
    --sidebar: var(--background); --sidebar-foreground: oklch(0.985 0 0);
    --sidebar-accent: oklch(0.269 0 0); --sidebar-border: oklch(1 0 0 / 10%);
    --app-ground: oklch(0.12 0 0);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Figtree", ui-sans-serif, system-ui, sans-serif; font-size: 13px; line-height: 1.38;
    color: var(--foreground); background: var(--app-ground); -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { width: 16px; height: 16px; flex: 0 0 auto; }
  [hidden] { display: none !important; }

  .app { display: flex; height: 100vh; overflow: hidden; }
  .sidebar {
    --w: 268px; width: var(--w); min-width: 200px; max-width: 420px; flex: 0 0 auto;
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--sidebar); border-right: 1px solid var(--sidebar-border);
  }
  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; padding: 6px 6px 6px 0; }
  .tabs { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 4px; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 10px;
    border-radius: 8px; color: var(--muted-foreground); box-shadow: inset 0 0 0 1px var(--sidebar-border);
  }
  .tab[data-active="true"] { color: var(--foreground); background: var(--card); box-shadow: inset 2px 0 0 0 var(--primary), 0 1px 2px rgba(0,0,0,.12); }
  .card { flex: 1 1 auto; border-radius: var(--radius-xl); background: var(--card); display: grid; place-items: center; color: var(--muted-foreground); font-size: 12px; }

  .head { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; padding: 10px 8px 6px; }
  .brand-row { display: flex; align-items: center; gap: 8px; height: 28px; padding-left: 4px; }
  .logo { width: 20px; height: 20px; border-radius: 6px; background: linear-gradient(140deg, var(--violet), var(--blue)); display: grid; place-items: center; color: white; }
  .logo svg { width: 12px; height: 12px; }
  .brand-row span { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .head-actions { margin-left: auto; display: flex; gap: 2px; }
  .icon-btn { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; color: var(--muted-foreground); }
  .icon-btn:hover { background: var(--sidebar-accent); color: var(--sidebar-foreground); }

  /* ── The switch ──
     Plain segmented control, the same shape the app already uses in the
     composer's send menu: two words, one selected. `count` rides in the label
     rather than beside it so the widths do not jump when a thread arrives. */
  .segment { display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--muted); }
  .seg { flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 26px; padding: 0 8px; border-radius: 7px; font-size: 12px; color: var(--muted-foreground); }
  .seg:hover { color: var(--sidebar-foreground); }
  .seg[data-active="true"] { background: var(--sidebar); color: var(--sidebar-foreground); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .seg .n { font-size: 10px; font-variant-numeric: tabular-nums; opacity: 0.7; }

  .search { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 9px; border-radius: 8px;
    color: var(--muted-foreground); box-shadow: inset 0 0 0 1px var(--sidebar-border); }
  .search:hover { background: var(--sidebar-accent); }
  kbd { font: inherit; font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-left: auto; color: var(--muted-foreground); background: var(--muted); }

  .chip-row { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 4px; padding: 0 8px 4px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 25px; padding: 0 9px 0 7px;
    border-radius: 999px; font-size: 12px; background: var(--muted); box-shadow: inset 0 0 0 1px var(--sidebar-border); }
  .chip:hover { background: var(--sidebar-accent); }
  .chip .dot { width: 6px; height: 6px; }

  .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 2px 8px 10px; }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: color-mix(in oklab, var(--foreground) 18%, transparent); border-radius: 999px; }

  /* A project group in the Threads view: a small heading, then its threads. */
  .group + .group { margin-top: 8px; }
  .group-head { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
    color: color-mix(in oklab, var(--sidebar-foreground) 52%, transparent); cursor: pointer; border-radius: 6px; }
  .group-head:hover { color: var(--sidebar-foreground); }
  .group-head .n { margin-left: auto; letter-spacing: 0; font-weight: 600; opacity: 0.7; }
  .chev { color: var(--muted-foreground); transition: transform 180ms ease; }
  [aria-expanded="true"] > .chev { transform: rotate(90deg); }
  .tree { margin-left: 12px; padding-left: 8px; border-left: 1px solid var(--sidebar-border); }

  .row { display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 8px; border-radius: 8px; text-align: left; }
  .row:hover { background: var(--sidebar-accent); }
  .row[data-active="true"] { background: var(--sidebar-accent); font-weight: 500; }
  .row .title { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .tail { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .row .sub { font-size: 11px; color: var(--muted-foreground); }
  .row .dot { width: 7px; height: 7px; border-radius: 999px; }
  .row.ask { background: color-mix(in oklab, var(--amber) 8%, transparent); }
  .row.bad { background: color-mix(in oklab, var(--destructive) 8%, transparent); }
  .dot.running { background: var(--green); animation: pulse 1.6s ease-in-out infinite; }
  .dot.waiting { background: var(--amber); }
  .dot.failed { background: var(--destructive); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* ── The Projects view ── the same folders v2 draws, but the whole viewport. */
  .pcard { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px; border-radius: 9px; text-align: left; }
  .pcard:hover { background: var(--sidebar-accent); }
  .pcard .mark { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; color: white; font-size: 11px; font-weight: 700; flex: 0 0 auto; }
  .pcard .name { min-width: 0; flex: 1; }
  .pcard .name b { display: block; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcard .name small { display: block; font-size: 11px; color: var(--muted-foreground); }
  .pcard .dot { width: 7px; height: 7px; border-radius: 999px; flex: 0 0 auto; }

  .foot { flex: 0 0 auto; display: flex; flex-direction: column; gap: 1px; padding: 6px 8px 8px; border-top: 1px solid var(--sidebar-border); }
  .foot .row { height: 30px; }
  .foot-nav { display: flex; flex-wrap: wrap; gap: 2px; padding: 0 2px; }
  .nav-link { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 7px; border-radius: 6px; font-size: 12px; color: var(--muted-foreground); }
  .nav-link:hover { background: var(--sidebar-accent); color: var(--sidebar-foreground); }
  .nav-link .n { font-size: 11px; opacity: 0.8; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header class="head">
      <div class="brand-row">
        <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M12 12v10"/></svg></span>
        <span>Daedalus</span>
        <div class="head-actions">
          <button class="icon-btn" title="New thread"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
      <div class="segment" id="seg"></div>
      <button class="search" id="search"></button>
    </header>
    <div class="chip-row" id="chips"></div>
    <div class="scroll" id="threads"></div>
    <div class="scroll" id="projects" hidden></div>
    <footer class="foot" id="foot"></footer>
  </aside>

  <main class="main">
    <div class="tabs">
      <button class="tab" data-active="true"><span class="dot" style="width:6px;height:6px;border-radius:999px;background:var(--green)"></span>Ship the composer width fix</button>
      <button class="tab">Index the rules table</button>
      <button class="tab" style="width:30px;padding:0;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="card">the dock — the transcript in front of you</div>
  </main>
</div>

<script>
  const PROJECTS = [
    { id: "harness", name: "daedalus-harness", short: "harness", hue: 292, initial: "D" },
    { id: "website", name: "marketing-site", short: "site", hue: 210, initial: "M" },
    { id: "infra", name: "infra", short: "infra", hue: 150, initial: "I" },
    { id: "docs", name: "handbook", short: "docs", hue: 60, initial: "H" },
  ]
  const THREADS = [
    { t: "Ship the composer width fix", p: "harness", s: "running", when: "now", active: true },
    { t: "Index the rules table", p: "harness", s: "waiting", when: "4m" },
    { t: "Pricing page copy", p: "website", s: "waiting", when: "22m" },
    { t: "PM2 fork mode", p: "infra", s: "failed", when: "1h" },
    { t: "Replay coalescing", p: "harness", s: "idle", when: "3h" },
    { t: "Trim the OG images", p: "website", s: "idle", when: "5h" },
    { t: "Terminal key row", p: "harness", s: "idle", when: "9h" },
    { t: "Onboarding rewrite", p: "docs", s: "idle", when: "1d" },
    { t: "Backup import", p: "infra", s: "idle", when: "1d" },
    { t: "Scratch — bridge profiling", p: "harness", s: "idle", when: "2d" },
  ]
  const proj = (id) => PROJECTS.find((p) => p.id === id) || PROJECTS[0]
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))
  const dot = (s) => (s === "idle" ? "" : `<span class="dot ${s}"></span>`)
  const rank = (t) => (t.s === "waiting" ? 0 : t.s === "failed" ? 1 : t.s === "running" ? 2 : 3)

  const pinned = THREADS.filter((t) => t.active)
  const collapsed = new Set(["docs", "infra"])
  let view = "threads"

  document.getElementById("seg").innerHTML = `
    <button class="seg" data-view="threads" data-active="true">Threads<span class="n">${THREADS.length}</span></button>
    <button class="seg" data-view="projects">Projects<span class="n">${PROJECTS.length}</span></button>`
  document.getElementById("search").innerHTML =
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search<kbd>⌘K</kbd>`
  document.getElementById("chips").innerHTML = pinned
    .map((t) => `<button class="chip">${dot(t.s)}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.t)}</span></button>`).join("")

  /* ── Threads: the same project grouping v2 folds into, but as the view ── */
  const groupOf = (p) => {
    const mine = THREADS.filter((t) => t.p === p.id).sort((a, b) => rank(a) - rank(b))
    if (!mine.length) return ""
    const open = !collapsed.has(p.id)
    return `
      <div class="group">
        <div class="group-head" data-fold="${p.id}" aria-expanded="${open}">
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
          ${esc(p.name)}<span class="n">${mine.length}</span>
        </div>
        <div class="tree" data-folded="${p.id}" ${open ? "" : "hidden"}>
          ${mine.map((t) => `
            <button class="row ${t.s === "waiting" ? "ask" : t.s === "failed" ? "bad" : ""}" data-active="${!!t.active}">
              ${dot(t.s)}<span class="title">${esc(t.t)}</span><span class="tail"><span class="sub">${t.when}</span></span>
            </button>`).join("")}
        </div>
      </div>`
  }
  document.getElementById("threads").innerHTML = PROJECTS.map(groupOf).join("")

  /* ── Projects: each project a card, with what is happening inside it ── */
  document.getElementById("projects").innerHTML = PROJECTS.map((p) => {
    const mine = THREADS.filter((t) => t.p === p.id)
    const live = mine.filter((t) => t.s === "running").length
    const ask = mine.filter((t) => t.s === "waiting" || t.s === "failed").length
    const state = live ? "running" : ask ? "waiting" : "idle"
    return `
      <button class="pcard">
        <span class="mark" style="background:oklch(0.55 0.18 ${p.hue})">${p.initial}</span>
        <span class="name">
          <b>${esc(p.name)}</b>
          <small>${mine.length} thread${mine.length === 1 ? "" : "s"}${ask ? ` · ${ask} need you` : live ? " · running" : ""}</small>
        </span>
        ${state === "idle" ? "" : `<span class="dot ${state}"></span>`}
      </button>` }).join("")

  document.getElementById("foot").innerHTML = `
    <div class="foot-nav">
      <button class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="11" rx="1"/></svg>Tasks</button>
      <button class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>Routines<span class="n">3</span></button>
      <button class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Scheduled</button>
    </div>
    <button class="row"><span class="sub">This machine</span><span class="tail"><span class="dot running"></span></span></button>`

  const show = (next) => {
    view = next
    for (const b of document.querySelectorAll(".seg")) b.dataset.active = String(b.dataset.view === next)
    document.getElementById("threads").hidden = next !== "threads"
    document.getElementById("projects").hidden = next !== "projects"
    document.getElementById("chips").hidden = next !== "threads"
  }
  for (const b of document.querySelectorAll(".seg")) b.addEventListener("click", () => show(b.dataset.view))

  for (const head of document.querySelectorAll(".group-head[data-fold]")) {
    head.addEventListener("click", () => {
      const open = head.getAttribute("aria-expanded") === "true"
      head.setAttribute("aria-expanded", String(!open))
      const target = document.querySelector(`[data-folded="${head.dataset.fold}"]`)
      if (target) target.hidden = open
    })
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "d" && !e.metaKey && !e.ctrlKey) document.documentElement.classList.toggle("dark")
    if (e.key === "1") show("threads")
    if (e.key === "2") show("projects")
  })
</script>
</body>
</html>
