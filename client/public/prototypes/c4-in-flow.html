<!doctype html>
<!--
  C4 — The composer in flow. Not docked over the transcript.

  The card sits at the end of the transcript, where the next message will
  land, instead of pinned over its foot. The transcript ends with it, so what
  you are reading is never under glass, and there is no measured
  `--composer-dock-h` reserve to keep in step with a box that grows.

  What it costs: the box moves as the thread grows (in the app it is the scroll
  position that pays for that), and on a live thread the working line is below
  the fold rather than in view. What it buys: nothing of the transcript is ever
  covered, and the thing you type into is where the conversation is going.

  The same option appears as a transcript layout in `t8-focus.html`; here it is
  the composer's own variant, so the two can be compared against C1.
-->
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<title>C4 — Composer in flow</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./transcript.css" />
<link rel="stylesheet" href="./composer.css" />
<style>
  .tv-scroll { padding-bottom: 30px; }
  .tv { position: absolute; inset: 0; }
  .tv .col { opacity: 0.4; mask-image: linear-gradient(to bottom, #000, #000 45%, transparent 96%); -webkit-mask-image: linear-gradient(to bottom, #000, #000 45%, transparent 96%); }
  .cmp-inline .cmp-card { box-shadow: 0 1px 4px rgba(0,0,0,.07); }
  .foot-hint { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 16px 0 0; font-size: 11px; color: color-mix(in oklab, var(--muted-foreground) 65%, transparent); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" data-sidebar></aside>
  <main class="main">
    <div data-tabs></div>
    <div class="panel">
      <div class="tv">
        <div class="tv-scroll"><div class="col" data-flow></div></div>
      </div>
      <div class="note right" style="left:14px; top:22%"><b>In flow</b> — nothing is docked, so the transcript reserves nothing and nothing is ever under glass.</div>
    </div>
  </main>
</div>
<script src="./shared-transcript.js"></script>
<script src="./shared-composer.js"></script>
<script>
  document.querySelector("[data-tabs]").innerHTML = TX.tabs("Ship the composer width fix")
  document.querySelector("[data-flow]").innerHTML =
    TX.render(TX.flow()) +
    `<div class="foot-hint">end of thread</div>` +
    CX.composer({ inline: true, typed: true, text: "and check it at 320px too", caret: true, shelf: "todos", ready: true })
  TX.sidebar(document.querySelector("[data-sidebar]"))
  TX.theme()
</script>
</body>
</html>
