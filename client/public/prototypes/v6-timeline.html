<!doctype html>
<!-- v6 — The timeline. One chronological spine, newest first, with a period
     heading for each run of days and the project a colour on every row. No
     folders anywhere: this is the "I think in time, not in projects" model, and
     it is what a chat app's sidebar is. Cost: finding an old thread in a known
     project means scrolling, and there is nowhere a project's *page* lives. -->
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/logo.svg" type="image/svg+xml" />
<title>v6 — Timeline</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./shared.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header class="sb-head">
      <div class="sb-title-row">
        <h2>All threads</h2>
        <div class="head-actions">
          <button class="icon-btn" data-new></button>
          <button class="icon-btn" data-sort></button>
        </div>
      </div>
      <div class="segment">
        <button class="seg" data-active="true">Everything</button>
        <button class="seg">Mine</button>
        <button class="seg">Shared</button>
      </div>
    </header>
    <div class="scroll" id="scroll"></div>
    <footer class="sb-foot" id="foot"></footer>
  </aside>
  <main class="main">
    <div class="tabs">
      <button class="tab" data-active="true"><span class="dot running"></span>Ship the composer width fix</button>
      <button class="tab">Index the rules table</button>
      <button class="tab" style="width:30px;padding:0;justify-content:center" id="add-tab"></button>
    </div>
    <div class="card">the dock — the transcript in front of you</div>
  </main>
</div>
<script src="./shared.js"></script>
<script>
  const { data, HTML, esc, tag, inDay, DAYS, on, theme, render, ICONS } = PROTO
  const { projects, threads } = data()

  document.querySelector("[data-new]").innerHTML = ICONS.plus
  document.querySelector("[data-sort]").innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 4v16M7 20l-3-3M17 20V4M17 4l3 3"/></svg>`
  document.getElementById("add-tab").innerHTML = ICONS.plus

  /* A period group, newest first, with the fold the reader expects of a long
     history: today and yesterday open, everything above them shut. */
  const section = (day, open = true) => {
    const mine = threads.filter(inDay(day))
    if (!mine.length) return ""
    return HTML`
      <div class="section">
        <div class="section-head clickable" data-fold="${day}" aria-expanded="${open}">
          ${ICONS.chev}${day}<span class="n">${mine.length}</span>
        </div>
        <div class="spine" data-folded="${day}" ${open ? "" : "hidden"}>
          ${mine.map((t) => HTML`
            <button class="row ${t.s === "waiting" ? "waiting" : t.s === "failed" ? "failed" : t.s}" data-active="${!!t.active}">
              <span class="title">${esc(t.t)}</span>
              <span class="tail">${tag(t.p)}<span class="sub">${t.when}</span></span>
            </button>`).join("")}
        </div>
      </div>`
  }

  render(document.getElementById("scroll"), DAYS.map((d, i) => section(d, i < 2)).join(""))

  document.getElementById("foot").innerHTML = HTML`
    <button class="row"><span class="sub">${projects.length} projects</span><span class="tail"><span class="sub">All threads ▸</span></span></button>
    <button class="row"><span class="sub">This machine</span><span class="tail"><span class="dot running"></span></span></button>`
  theme()
</script>
</body>
</html>
