<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Daedalus mark: a chars logo — the letter D held between two chevrons, the
       client and the agent with the harness piping between them. Drawn as strokes
       rather than set in a font, so it renders identically as favicon, PWA icon
       and img with no font to load. The splash in index.html inlines the same four
       paths and draws them in order — keep the two in sync.
       #007595 is the primary token, oklch(0.52 0.105 223.128). -->
  <g fill="none" stroke="#007595" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 17 L9 32 L20 47"/>
    <path d="M44 17 L55 32 L44 47"/>
    <path d="M25 21 V43"/>
    <path d="M25 21 H28 A11 11 0 0 1 28 43 H25"/>
  </g>
</svg>
